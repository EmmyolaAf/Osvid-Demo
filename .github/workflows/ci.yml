name: CI - Production Runtime & Security Gates

on:
  push:
    branches:
      - handover-hardening
      - main
  pull_request:
    branches:
      - handover-hardening
      - main

jobs:
  validate:
    name: Build, Test & Emulator Release Gates
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      FIREBASE_PROJECT_ID: demo-osvid-rules-test
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-osvid-rules-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21 (Temurin) for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Unit & Integration Tests (Mocked Provider Suites)
        run: npm test

      - name: Production Standalone Build
        run: npm run build

      - name: Real Firebase Emulator Security Rules Gate
        run: npm run test:emulator
