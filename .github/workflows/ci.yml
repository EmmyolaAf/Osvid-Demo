name: CI - Production Runtime & Security Gates

on:
  push:
    branches:
      - handover-hardening
      - main
  pull_request:
    branches:
      - handover-hardening
      - main

jobs:
  validate:
    name: Build, Test & Emulator Release Gates
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      FIREBASE_PROJECT_ID: demo-osvid-rules-test
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-osvid-rules-test
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key-for-ci-compilation-only
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-osvid-rules-test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-osvid-rules-test.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789012:web:democi0000000000000
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-DEMOCI000
      NEXT_PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21 (Temurin) for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Unit & Integration Tests (Mocked Provider Suites)
        run: npm test

      - name: Production Standalone Build
        run: npm run build

      - name: Real Firebase Emulator Security Rules Gate
        run: npm run test:emulator
